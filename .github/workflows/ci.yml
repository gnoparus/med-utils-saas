name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests (CI)
        run: npm run test:ci
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

  vercel-preview-note:
    name: Vercel Preview Note
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    steps:
      - name: Add PR comment about Vercel preview
        # This step does not deploy — Vercel will create previews automatically when linked.
        # We add a lightweight informational comment so PR authors know previews are available.
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request
            if (!pr) {
              core.info('Not a PR event — skipping comment.')
            } else {
              const body = `
              CI checks completed ✅

              - Lint, typecheck and tests passed.
              - Vercel will (or already has) created a preview deployment for this PR if Vercel is configured for the repo.
              - If you don't see a Vercel preview, check the Vercel dashboard or the GitHub checks UI for the Vercel deploy step.

              \`med-utils-saas\` CI
              `
              await github.issues.createComment({
                ...context.repo,
                issue_number: pr.number,
                body,
              })
            }
